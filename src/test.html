<!DOCTYPE html>
<html>
<head>
    <title>Test Chess Engine</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #333; color: white; }
        .pass { border-left: 4px solid green; padding-left: 10px; margin: 5px 0; }
        .fail { border-left: 4px solid red; padding-left: 10px; margin: 5px 0; }
    </style>
</head>
<body>
    <h2>Chess Engine Test Suite</h2>
    <div id="results"></div>
    
    <script src="game.js"></script>
    <script src="model.js"></script>
    <script>
        const resultsDiv = document.getElementById('results');
        let passed = 0, failed = 0;

        function test(name, condition) {
            const div = document.createElement('div');
            div.className = condition ? 'pass' : 'fail';
            div.textContent = (condition ? '✓ PASS: ' : '✗ FAIL: ') + name;
            resultsDiv.appendChild(div);
            if (condition) passed++; else failed++;
        }

        // Run tests after game loads
        document.addEventListener('DOMContentLoaded', () => {
           const game = new ChessGame();
            game.createBoard();
            
            test('Initial position created', game.board.length === 8);
            test('White pieces on rank 1-2', 
                game.board[7].every(p => p && p.toUpperCase() === p) &&
                game.board[6].every(p => p?.toUpperCase() !== p));
            
            // Test pawn movement validation
            const whitePawnMoves = game.getValidMoves(6, 4); // E2 pawn
            test('White pawn has initial two-square option', 
                whitePawnMoves.some(m => m.to.row === 4 && m.to.col === 4));

            // Test knight moves
            const knightMoves = game.getValidMoves(7, 1); // B1 knight
            test('Knight can make L-shaped moves', 
                knightMoves.length >= 2);

            // Test AI is available
            test('AI model loaded', typeof ChessLLM !== 'undefined');

            // Test check detection
            game.board[4][4] = null; // Clear center
            const simplifiedBoard = JSON.parse(JSON.stringify(game.board));
            
            // Create a check scenario
            game.board[0][4] = null; // Remove black king position temporarily
            test('Check detection method exists', typeof game.isKingInCheck === 'function');

            document.getElementById('results').innerHTML += 
                `<p style="margin-top: 20px;">Total: ${passed} passed, ${failed} failed</p>`;
        });
    </script>
</body>
</html>
